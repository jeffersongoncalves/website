; =============================================================================
; PHP FPM Configuration - Production (web requests)
; =============================================================================

[PHP]
engine = On
short_open_tag = Off
precision = 14
output_buffering = 4096
zlib.output_compression = On
zlib.output_compression_level = 4
implicit_flush = Off
serialize_precision = -1

expose_php = Off
; proc_open/popen required by Symfony Process (Laravel Horizon supervisors).
; curl_exec/curl_multi_exec required by Guzzle (Laravel HTTP client).
; NOTE: disable_functions is cumulative across .ini files - declare it only here.
disable_functions = exec,passthru,shell_exec,system,show_source,dl
allow_url_fopen = On
allow_url_include = Off
; Ampliado: inclui CA bundle, random, libs PHP e /proc/self para pcntl/proc_open
open_basedir = /var/www/html:/tmp:/var/log:/dev/urandom:/dev/null:/etc/ssl/certs:/usr/local/etc/php:/usr/local/lib/php:/proc/self

max_execution_time = 120
max_input_time = 60
max_input_nesting_level = 256
max_input_vars = 5000
memory_limit = 512M

error_reporting = E_ALL & ~E_DEPRECATED & ~E_STRICT
display_errors = Off
display_startup_errors = Off
log_errors = On
log_errors_max_len = 4096
error_log = /var/log/php-error.log
ignore_repeated_errors = On
ignore_repeated_source = Off

file_uploads = On
upload_max_filesize = 50M
max_file_uploads = 20
post_max_size = 55M

default_charset = "UTF-8"
default_mimetype = "text/html"
variables_order = "GPCS"
request_order = "GP"
register_argc_argv = Off
auto_globals_jit = On

enable_dl = Off
cgi.fix_pathinfo = 0

session.save_handler = files
session.use_strict_mode = 1
session.use_cookies = 1
session.use_only_cookies = 1
session.cookie_httponly = 1
session.cookie_secure = 1
session.cookie_samesite = "Lax"
session.gc_maxlifetime = 1440
session.gc_probability = 1
session.gc_divisor = 1000
session.sid_length = 48
session.sid_bits_per_character = 6

date.timezone = UTC

[opcache]
opcache.enable = 1
; CLI desabilitado aqui; workers Horizon reforcam via flag -d no supervisord
opcache.enable_cli = 0
opcache.memory_consumption = 256
opcache.interned_strings_buffer = 64
opcache.max_accelerated_files = 30000
opcache.max_wasted_percentage = 10
opcache.validate_timestamps = 0
opcache.revalidate_freq = 0
opcache.save_comments = 1
opcache.fast_shutdown = 1
opcache.jit = tracing
opcache.jit_buffer_size = 128M
opcache.preload=
opcache.preload_user=

[realpath_cache]
realpath_cache_size = 4096K
realpath_cache_ttl = 600

[curl]
curl.cainfo = /etc/ssl/certs/ca-certificates.crt

[intl]
intl.default_locale = en
intl.error_level = 0

[gd]
gd.jpeg_ignore_warning = 1
