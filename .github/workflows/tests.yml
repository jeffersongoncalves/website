name: tests

on:
  push:
    branches:
      - main
    paths:
      - '**.php'
      - 'phpunit.xml'
      - 'composer.json'
      - 'composer.lock'
      - '.github/workflows/tests.yml'
  pull_request:
  workflow_dispatch:

jobs:
  pest:
    name: pest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          # 8.4: the locked symfony v8 / tempest/highlight deps require
          # PHP >= 8.4 and won't install on 8.3.
          php-version: '8.4'
          extensions: pcntl, redis, sqlite3, pdo_sqlite
          coverage: pcov

      - name: Install composer dependencies
        uses: ramsey/composer-install@26d8a556604053a9612623447203a691f406fbe6 # v4

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Run tests
        env:
          DB_CONNECTION: sqlite
          DB_DATABASE: ':memory:'
          CACHE_STORE: array
          QUEUE_CONNECTION: sync
          SESSION_DRIVER: array
          # Pin to the same locale the test assertions are written against
          # (the .env.example default is pt_BR for the production site).
          APP_LOCALE: en
          APP_FALLBACK_LOCALE: en
        run: ./vendor/bin/pest --coverage --min=88
