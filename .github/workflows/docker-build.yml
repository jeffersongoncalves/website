name: Build and Push Docker Image

on:
  push:
    tags: ['release-*.*.*']
  workflow_dispatch:

concurrency:
  # Global lock — qualquer release-*.*.* enfileira atras do anterior. Garante
  # que GHCR :latest, GitHub Release e o cache do BuildKit nao sejam mexidos
  # por dois runs simultaneos (cenario que rolava quando duas tags eram
  # pushadas no mesmo minuto). cancel-in-progress=false preserva todo
  # release na fila — perder uma publicacao nunca eh aceitavel.
  group: docker-build
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          # Build roda apenas em tags release-*.*.*: publica a tag + sha + :latest.
          tags: |
            type=ref,event=tag
            type=sha,prefix=
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/release-') }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Resolve app version from tag
        id: appver
        run: |
          REF="${GITHUB_REF_NAME}"
          VERSION="${REF#release-}"
          echo "value=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Build and push
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            APP_VERSION=${{ steps.appver.outputs.value }}
            IMAGE_SOURCE=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          # Registry-backed build cache (a dedicated :buildcache image in GHCR).
          # Unlike type=gha — which the Actions Cache API isolates per git ref, so
          # each release-*.*.* tag built with a cold cache and recompiled every PHP
          # extension (~1m45s) — the registry cache has no ref scoping and no 7-day
          # eviction. Every release reads AND writes it, so php-base + composer-deps
          # stay warm across releases and the build is self-sustaining.
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:buildcache
          cache-to: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:buildcache,mode=max

      - name: Verify :latest digest matches tag digest
        # Smoke-test: se :latest foi publicado nessa run, confirma que aponta
        # pro mesmo digest da tag release-X.Y.Z. Falha o job se divergir —
        # evita :latest silenciosamente apontando pra build antiga.
        if: startsWith(github.ref, 'refs/tags/release-')
        run: |
          TAG_DIGEST=$(docker buildx imagetools inspect "${REGISTRY}/${IMAGE_NAME}:${GITHUB_REF_NAME}" --format '{{.Manifest.Digest}}')
          LATEST_DIGEST=$(docker buildx imagetools inspect "${REGISTRY}/${IMAGE_NAME}:latest" --format '{{.Manifest.Digest}}')
          echo "Tag ${GITHUB_REF_NAME} digest: ${TAG_DIGEST}"
          echo "Latest digest:              ${LATEST_DIGEST}"
          if [ "${TAG_DIGEST}" != "${LATEST_DIGEST}" ]; then
            echo "::error::Digest mismatch — :latest did not get promoted to this release"
            exit 1
          fi

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/release-')
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          generate_release_notes: true
          body: |
            Docker image: `${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.ref_name }}`

            Pull: `docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.ref_name }}`
