name: tests

on:
  push:
    paths:
      - '**.php'
      - 'phpunit.xml'
      - 'composer.json'
      - 'composer.lock'
      - '.github/workflows/tests.yml'
  pull_request:
  workflow_dispatch:

jobs:
  pest:
    name: pest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pcntl, redis, sqlite3, pdo_sqlite
          coverage: none

      - name: Install composer dependencies
        uses: ramsey/composer-install@v4

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Run tests
        env:
          DB_CONNECTION: sqlite
          DB_DATABASE: ':memory:'
          CACHE_STORE: array
          QUEUE_CONNECTION: sync
          SESSION_DRIVER: array
          # Pin to the same locale the test assertions are written against
          # (the .env.example default is pt_BR for the production site).
          APP_LOCALE: en
          APP_FALLBACK_LOCALE: en
        run: ./vendor/bin/pest
