[supervisord]
nodaemon=true
user=root
logfile=/var/log/supervisor/supervisord.log
pidfile=/var/run/supervisord.pid

[program:php-fpm]
command=php-fpm -F
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:horizon]
; -d flags: desliga opcache/JIT (evita segfault em long-running workers),
;           desliga output_buffering/zlib (erros aparecem em tempo real),
;           max_execution_time=0 (evita conflito com pcntl_alarm do Horizon).
command=php -d opcache.enable_cli=0 -d opcache.jit=off -d opcache.jit_buffer_size=0 -d output_buffering=0 -d zlib.output_compression=Off -d max_execution_time=0 /var/www/html/artisan horizon
autostart=true
autorestart=true
user=www-data
stopsignal=TERM
stopwaitsecs=3600
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
environment=APP_ENV="production"

[program:schedule]
command=/bin/sh -c "while true; do php -d opcache.enable_cli=0 -d opcache.jit=off /var/www/html/artisan schedule:run --no-interaction; sleep 60; done"
autostart=true
autorestart=true
user=www-data
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:nginx]
command=nginx -g "daemon off;"
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
