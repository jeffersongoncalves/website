name: Build and Push Docker Image

on:
  push:
    tags: ['release-*.*.*']
  workflow_dispatch:

concurrency:
  # Por-ref: builds de tags/branches diferentes rodam em paralelo sem conflitar;
  # pushes sucessivos na mesma ref serializam. cancel-in-progress=false garante
  # que nenhuma publicação seja perdida.
  group: docker-build-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          # Build roda apenas em tags release-*.*.*: publica a tag + sha + :latest.
          tags: |
            type=ref,event=tag
            type=sha,prefix=
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/release-') }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify :latest digest matches tag digest
        # Smoke-test: se :latest foi publicado nessa run, confirma que aponta
        # pro mesmo digest da tag release-X.Y.Z. Falha o job se divergir —
        # evita :latest silenciosamente apontando pra build antiga.
        if: startsWith(github.ref, 'refs/tags/release-')
        run: |
          TAG_DIGEST=$(docker buildx imagetools inspect "${REGISTRY}/${IMAGE_NAME}:${GITHUB_REF_NAME}" --format '{{.Manifest.Digest}}')
          LATEST_DIGEST=$(docker buildx imagetools inspect "${REGISTRY}/${IMAGE_NAME}:latest" --format '{{.Manifest.Digest}}')
          echo "Tag ${GITHUB_REF_NAME} digest: ${TAG_DIGEST}"
          echo "Latest digest:              ${LATEST_DIGEST}"
          if [ "${TAG_DIGEST}" != "${LATEST_DIGEST}" ]; then
            echo "::error::Digest mismatch — :latest did not get promoted to this release"
            exit 1
          fi

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/release-')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          generate_release_notes: true
          body: |
            Docker image: `${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.ref_name }}`

            Pull: `docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.ref_name }}`
