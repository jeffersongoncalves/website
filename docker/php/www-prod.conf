; =============================================================================
; PHP-FPM Pool Configuration - High Performance Production
; =============================================================================

[www]
; --------------------------------------------------------------------------
; User/Group
; --------------------------------------------------------------------------
user = www-data
group = www-data

; --------------------------------------------------------------------------
; Listen
; --------------------------------------------------------------------------
listen = 127.0.0.1:9000
listen.allowed_clients = 127.0.0.1

; --------------------------------------------------------------------------
; Process Manager: dynamic — scales workers with traffic to drop the idle
; memory floor (~3 workers at rest vs 20 always-on) while still bursting to
; max_children under load. max_children sized to this container's ~2.5GB cap
; (~(2.5GB*0.7)/100MB). max_requests recycles a worker every 500 reqs to cap
; per-worker memory growth.
; --------------------------------------------------------------------------
pm = dynamic
pm.max_children = 12
pm.start_servers = 3
pm.min_spare_servers = 2
pm.max_spare_servers = 6
pm.max_requests = 500

; --------------------------------------------------------------------------
; Timeouts
; --------------------------------------------------------------------------
request_terminate_timeout = 120
request_slowlog_timeout = 5s

; --------------------------------------------------------------------------
; Logging
; --------------------------------------------------------------------------
slowlog = /var/log/php-fpm-slow.log
catch_workers_output = yes
decorate_workers_output = no

; --------------------------------------------------------------------------
; Security
; --------------------------------------------------------------------------
security.limit_extensions = .php

; --------------------------------------------------------------------------
; Environment (clean, pass only essentials)
; --------------------------------------------------------------------------
clear_env = no
